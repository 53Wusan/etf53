name: Check strategy desk
on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/check-desk.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/restore-runtime.py
      - run: pip install './backend[dev]'
      - run: python -m pytest backend/tests/test_market_brief.py backend/tests/test_account_observation.py backend/tests/test_execution_data_refresh.py backend/tests/test_daily_update.py backend/tests/test_shadow_account.py backend/tests/test_encrypted_data.py -q
        env:
          PYTHONPATH: backend
      - run: corepack enable && pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec vitest run --environment jsdom
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
